syntax = "proto3";

package game.v1;

option go_package = "lms/backend/gen/game/v1;gamev1";

import "google/protobuf/timestamp.proto";

// Live multiplayer quiz game (Kahoot-style) played over an existing
// `pilihan_ganda` (single-correct) assignment. The host (teacher) drives the
// flow; students join with a PIN. Clients poll GetGameState (~1s) for state.

// ── Host: create a live game from an existing pilihan_ganda quiz ──
message CreateGameRequest {
  string assignment_id = 1;
  int32 duration_seconds = 2; // per-question countdown (default 20 if <=0)
}
message CreateGameResponse {
  string session_id = 1;
  string pin = 2;
  int32 question_count = 3;
}

// ── Student: join a live game by PIN ──
message JoinGameRequest {
  string pin = 1;
  string nickname = 2; // defaults to the student's name when empty
}
message JoinGameResponse {
  string session_id = 1;
  string player_id = 2;
  int32 question_count = 3;
  string host_name = 4;
  string assignment_title = 5;
}

// ── Host controls ──
message StartQuestionRequest { string session_id = 1; int32 index = 2; }
message StartQuestionResponse {}
message RevealQuestionRequest { string session_id = 1; }
message RevealQuestionResponse {}
message EndGameRequest { string session_id = 1; }
message EndGameResponse {}

// ── Student answers the active question ──
message SubmitGameAnswerRequest {
  string session_id = 1;
  int32 question_index = 2;
  int32 option_index = 3;
}
message SubmitGameAnswerResponse { bool accepted = 1; }

message PlayerScore {
  string player_id = 1;
  string nickname = 2;
  int32 score = 3;
  int32 rank = 4;
  string avatar = 5; // player's LMS profile photo (URL/data URL), or "" for initials
}

// Player's own outcome for the active question (populated on reveal/ended).
message MyResult {
  bool answered = 1;
  int32 option_index = 2;
  bool is_correct = 3;
  int32 points = 4;       // points earned this question
  int32 streak = 5;
  int32 total_score = 6;
  int32 rank = 7;
}

// ── Poll: role-aware snapshot of the whole game ──
message GetGameStateRequest { string session_id = 1; }
message GetGameStateResponse {
  string status = 1;                        // 'lobby' | 'question' | 'reveal' | 'ended'
  int32 current_index = 2;
  int32 question_count = 3;
  bool is_host = 4;
  google.protobuf.Timestamp server_time = 5;
  google.protobuf.Timestamp current_started_at = 6;
  int32 duration_seconds = 7;
  int32 player_count = 8;
  repeated PlayerScore leaderboard = 9;     // sorted desc (top players)
  string assignment_title = 10;
  string host_name = 11;

  // Active question (present when status = question/reveal).
  string question = 12;
  repeated string options = 13;
  string image = 14;
  int32 correct_index = 15;                 // -1 unless reveal/ended

  // Player view.
  MyResult my_result = 16;

  // Host view (reveal): how many picked each option + who has answered.
  repeated int32 answer_distribution = 17;
  int32 answered_count = 18;
}

service GameService {
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  rpc JoinGame(JoinGameRequest) returns (JoinGameResponse);
  rpc StartQuestion(StartQuestionRequest) returns (StartQuestionResponse);
  rpc RevealQuestion(RevealQuestionRequest) returns (RevealQuestionResponse);
  rpc EndGame(EndGameRequest) returns (EndGameResponse);
  rpc SubmitGameAnswer(SubmitGameAnswerRequest) returns (SubmitGameAnswerResponse);
  rpc GetGameState(GetGameStateRequest) returns (GetGameStateResponse);
}
