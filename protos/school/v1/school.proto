syntax = "proto3";

package school.v1;

option go_package = "lms/backend/gen/school/v1;schoolv1";

import "google/protobuf/timestamp.proto";

message School {
  string name           = 1;
  string address        = 2;
  string app_name       = 3;
  string logo           = 4; // base64 data URL
  string profil         = 5;
  string visi           = 6;
  string misi           = 7;
  string kepala_sekolah = 8;
  string tahun_berdiri  = 9;
  string email          = 10;
  string whatsapp       = 11;
  string npsn           = 12;
  string status         = 13; // Negeri / Swasta
  string akreditasi     = 14;
  string jenjang        = 15; // SD / SMP / SMA / SMK …
  string profil_image   = 16; // URL / data URL
  string profil_video   = 17; // video link (YouTube …)
  string maps_url       = 18; // Google Maps link
  string ppdb_aktif     = 19; // '1' = tampilkan menu PPDB
  string ppdb_info      = 20;
  string ppdb_brosur    = 21; // URL / data URL
  string ppdb_daftar_url = 22;
  string ppdb_pengumuman = 23;
  string kepala_sekolah_foto = 24; // URL / data URL
  bool has_game_music = 25;        // an uploaded game soundtrack exists (served at /game-music)
  string game_music_name = 26;     // display name of the uploaded track
  string kepala_sekolah_ttd = 27;  // headmaster signature image (URL / data URL)
}

// A staff member (guru / tata usaha) shown on the landing page.
message Staff {
  string id = 1;
  string nama = 2;
  string jabatan = 3;
  string foto = 4; // URL / data URL
}
message StaffInput {
  string nama = 1;
  string jabatan = 2;
  string foto = 3;
}

message Semester {
  string id           = 1;
  string semester     = 2; // 'ganjil' | 'genap'
  string tahun_ajaran = 3; // '2026/2027'
  bool   is_active    = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetSchoolRequest {}
// All fields optional — only the ones sent are updated (merge), so partial
// edits from different screens don't wipe each other.
message UpdateSchoolRequest {
  optional string name           = 1;
  optional string address        = 2;
  optional string app_name       = 3;
  optional string logo           = 4;
  optional string profil         = 5;
  optional string visi           = 6;
  optional string misi           = 7;
  optional string kepala_sekolah = 8;
  optional string tahun_berdiri  = 9;
  optional string email          = 10;
  optional string whatsapp       = 11;
  optional string npsn           = 12;
  optional string status         = 13;
  optional string akreditasi     = 14;
  optional string jenjang        = 15;
  optional string profil_image    = 16;
  optional string profil_video    = 17;
  optional string maps_url        = 18;
  optional string ppdb_aktif      = 19;
  optional string ppdb_info       = 20;
  optional string ppdb_brosur     = 21;
  optional string ppdb_daftar_url = 22;
  optional string ppdb_pengumuman = 23;
  optional string kepala_sekolah_foto = 24;
  optional string game_music_data = 25; // audio data URL; "" clears, absent = unchanged
  optional string game_music_name = 26;
  optional string kepala_sekolah_ttd = 27;
}

message ListStaffRequest {}
message ListStaffResponse { repeated Staff staff = 1; }
message SetStaffRequest { repeated StaffInput staff = 1; }

// Generic content item (galeri/jurusan/berita/pengumuman/agenda/kelulusan).
message ContentItem {
  string id = 1;
  string type = 2;
  string title = 3;
  string subtitle = 4;
  string body = 5;
  string image = 6;
  string url = 7;
}
message ContentInput {
  string title = 1;
  string subtitle = 2;
  string body = 3;
  string image = 4;
  string url = 5;
}
message ListContentRequest { string type = 1; }
message ListContentResponse { repeated ContentItem items = 1; }
message SetContentRequest { string type = 1; repeated ContentInput items = 2; }

// Central access policy: capability keys (e.g. "materi.edit", "materi.delete")
// that are DENIED to teachers globally. Empty = everything allowed. Admin-only.
message GetAccessPolicyRequest {}
message AccessPolicyResponse { repeated string denied_keys = 1; }
message SetAccessPolicyRequest { repeated string denied_keys = 1; }

// Download a consistent snapshot of the SQLite database. Admin-only.
message ExportBackupRequest {}
message ExportBackupResponse {
  bytes  data     = 1;
  string filename = 2;
}
message RestoreBackupRequest { bytes data = 1; }
message RestoreBackupResponse { string message = 1; }

message CreateSemesterRequest { string semester = 1; string tahun_ajaran = 2; }
message ListSemestersRequest {}
message ListSemestersResponse { repeated Semester semesters = 1; }
message SetActiveSemesterRequest { string id = 1; }
message DeleteSemesterRequest { string id = 1; }
message DeleteSemesterResponse {}

// ── PPDB: pendaftaran calon murid (submit publik, kelola oleh admin) ──
message PpdbPhone { string label = 1; string number = 2; }
message PpdbRegistration {
  string id = 1;
  string nama = 2;
  string tempat_lahir = 3;
  string tanggal_lahir = 4;  // 'YYYY-MM-DD'
  string jenis_kelamin = 5;  // 'L' | 'P'
  string asal_sekolah = 6;
  string jurusan = 7;
  string nama_ortu = 8;      // nama orang tua / wali
  string alamat = 9;
  string email = 10;
  string nisn = 11;
  string no_kk = 12;         // nomor kartu keluarga
  repeated PpdbPhone phones = 13;
  string status = 14;        // 'baru' | 'diterima' | 'ditolak'
  string catatan = 15;       // catatan admin
  google.protobuf.Timestamp created_at = 16;
  string batch_id = 17;
  string no_pendaftaran = 18;
  string password = 19;      // exam credential (admin-only; blanked for applicant/public)
  int32 test_score = 20;     // -1 = belum ujian
  bool test_submitted = 21;
  string tahun_ajaran = 22;  // from batch (convenience)
  int32 gelombang = 23;
  string doc_link = 24;      // applicant-submitted Google Drive link
  repeated PpdbDoc docs = 25; // uploaded document files (metadata only)
  bool wa_sent = 26;         // admin sudah menghubungi via WhatsApp
}
message PpdbDoc { string id = 1; string name = 2; }
message PpdbDocFile { string name = 1; string data = 2; } // data URL for upload
message SubmitPpdbDocumentsRequest {
  string registration_id = 1;
  string doc_link = 2;
  repeated PpdbDocFile files = 3;
}
message SubmitPpdbDocumentsResponse { int32 uploaded = 1; }
message ListPpdbDocumentsRequest { string registration_id = 1; }
message ListPpdbDocumentsResponse { repeated PpdbDoc docs = 1; }
message SubmitPpdbRegistrationRequest {
  string nama = 1;
  string tempat_lahir = 2;
  string tanggal_lahir = 3;
  string jenis_kelamin = 4;
  string asal_sekolah = 5;
  string jurusan = 6;
  string nama_ortu = 7;
  string alamat = 8;
  string email = 9;
  string nisn = 10;
  string no_kk = 11;
  repeated PpdbPhone phones = 12;
}
message ListPpdbRegistrationsRequest {
  string batch_id = 1;  // "" = active batch
  string jurusan = 2;   // "" = all
  string search = 3;    // name substring
}
message ListPpdbRegistrationsResponse { repeated PpdbRegistration items = 1; }
message UpdatePpdbStatusRequest { string id = 1; string status = 2; string catatan = 3; }
message DeletePpdbRegistrationRequest { string id = 1; }
message DeletePpdbRegistrationResponse {}
message PublishPpdbAnnouncementRequest { string tahun_ajaran = 1; }
message PublishPpdbAnnouncementResponse { int32 count = 1; }
message MarkPpdbWaRequest { repeated string ids = 1; bool sent = 2; }
message MarkPpdbWaResponse {}

// ── PPDB gelombang (per tahun ajaran) ──
message PpdbBatch {
  string id = 1;
  string tahun_ajaran = 2;
  int32 gelombang = 3;
  string nama = 4;
  bool is_active = 5;
  string buka = 6;
  string tutup = 7;
  bool has_brosur = 8;              // streamed at /ppdb-brosur?batch=<id>
  string drive_link = 9;
  string panduan = 10;
  repeated string required_docs = 11;
  map<string, int32> kuota = 12;    // {TKJ,TKR,TPM,TSM}
  bool test_active = 13;
  int32 test_duration_minutes = 14;
  int32 pendaftar_count = 15;       // admin view
}
message ListPpdbBatchesRequest {}
message ListPpdbBatchesResponse { repeated PpdbBatch batches = 1; }
message GetActivePpdbBatchRequest {}                 // public
message CreatePpdbBatchRequest { string tahun_ajaran = 1; int32 gelombang = 2; }
message UpdatePpdbBatchRequest {
  string id = 1;
  optional string buka = 2;
  optional string tutup = 3;
  optional string brosur = 4;       // data URL; "" clears; absent = unchanged
  optional string drive_link = 5;
  optional string panduan = 6;
  repeated string required_docs = 7; // full replace
  map<string, int32> kuota = 8;      // full replace
  optional bool test_active = 9;
  optional int32 test_duration_minutes = 10;
  optional string nama = 11;
}
message SetActivePpdbBatchRequest { string id = 1; }
message DeletePpdbBatchRequest { string id = 1; }
message DeletePpdbBatchResponse {}

// ── PPDB bank soal (pilihan ganda) ──
message PpdbQuestion {
  string id = 1;
  string question = 2;
  repeated string options = 3;
  int32 correct_index = 4;   // -1 for applicants
}
message PpdbQuestionInput { string question = 1; repeated string options = 2; int32 correct_index = 3; }
message ListPpdbQuestionsRequest { string batch_id = 1; }
message ListPpdbQuestionsResponse { repeated PpdbQuestion questions = 1; }
message SetPpdbQuestionsRequest { string batch_id = 1; repeated PpdbQuestionInput questions = 2; }
message SetPpdbQuestionsResponse {}

// ── PPDB ujian (pendaftar login + tes) ──
message PpdbLoginRequest { string no_pendaftaran = 1; string password = 2; }
message PpdbLoginResponse {
  string token = 1;
  string nama = 2;
  bool test_active = 3;
  bool test_submitted = 4;
  int32 duration_minutes = 5;
}
message GetPpdbTestRequest {}
message GetPpdbTestResponse { repeated PpdbQuestion questions = 1; int32 duration_minutes = 2; bool submitted = 3; }
message PpdbTestAnswerInput { int32 question_index = 1; int32 option_index = 2; }
message SubmitPpdbTestRequest { repeated PpdbTestAnswerInput answers = 1; }
message SubmitPpdbTestResponse { int32 score = 1; int32 correct = 2; int32 total = 3; }
message GetMyPpdbRequest {}

service SchoolService {
  rpc GetSchool(GetSchoolRequest) returns (School);
  rpc UpdateSchool(UpdateSchoolRequest) returns (School);
  rpc CreateSemester(CreateSemesterRequest) returns (Semester);
  rpc ListSemesters(ListSemestersRequest) returns (ListSemestersResponse);
  rpc SetActiveSemester(SetActiveSemesterRequest) returns (Semester);
  rpc DeleteSemester(DeleteSemesterRequest) returns (DeleteSemesterResponse);
  rpc ListStaff(ListStaffRequest) returns (ListStaffResponse);        // public
  rpc SetStaff(SetStaffRequest) returns (ListStaffResponse);          // kelola_sekolah
  rpc ListContent(ListContentRequest) returns (ListContentResponse);  // public
  rpc SetContent(SetContentRequest) returns (ListContentResponse);    // kelola_sekolah
  rpc GetAccessPolicy(GetAccessPolicyRequest) returns (AccessPolicyResponse);  // admin
  rpc SetAccessPolicy(SetAccessPolicyRequest) returns (AccessPolicyResponse);  // admin
  rpc ExportBackup(ExportBackupRequest) returns (ExportBackupResponse);        // admin
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);     // admin
  rpc SubmitPpdbRegistration(SubmitPpdbRegistrationRequest) returns (PpdbRegistration);   // public
  rpc ListPpdbRegistrations(ListPpdbRegistrationsRequest) returns (ListPpdbRegistrationsResponse); // kelola_sekolah
  rpc UpdatePpdbStatus(UpdatePpdbStatusRequest) returns (PpdbRegistration);    // kelola_sekolah
  rpc DeletePpdbRegistration(DeletePpdbRegistrationRequest) returns (DeletePpdbRegistrationResponse); // kelola_sekolah
  rpc PublishPpdbAnnouncement(PublishPpdbAnnouncementRequest) returns (PublishPpdbAnnouncementResponse); // kelola_sekolah
  rpc MarkPpdbWa(MarkPpdbWaRequest) returns (MarkPpdbWaResponse); // kelola_sekolah

  // PPDB gelombang (admin), + active batch (public)
  rpc GetActivePpdbBatch(GetActivePpdbBatchRequest) returns (PpdbBatch);       // public
  rpc ListPpdbBatches(ListPpdbBatchesRequest) returns (ListPpdbBatchesResponse); // kelola_sekolah
  rpc CreatePpdbBatch(CreatePpdbBatchRequest) returns (PpdbBatch);             // kelola_sekolah
  rpc UpdatePpdbBatch(UpdatePpdbBatchRequest) returns (PpdbBatch);             // kelola_sekolah
  rpc SetActivePpdbBatch(SetActivePpdbBatchRequest) returns (PpdbBatch);       // kelola_sekolah
  rpc DeletePpdbBatch(DeletePpdbBatchRequest) returns (DeletePpdbBatchResponse); // kelola_sekolah

  // PPDB bank soal (admin)
  rpc ListPpdbQuestions(ListPpdbQuestionsRequest) returns (ListPpdbQuestionsResponse); // kelola_sekolah
  rpc SetPpdbQuestions(SetPpdbQuestionsRequest) returns (SetPpdbQuestionsResponse);     // kelola_sekolah

  // PPDB ujian (pendaftar; login public, test needs role 'ppdb')
  rpc PpdbLogin(PpdbLoginRequest) returns (PpdbLoginResponse);                 // public
  rpc GetPpdbTest(GetPpdbTestRequest) returns (GetPpdbTestResponse);           // role 'ppdb'
  rpc SubmitPpdbTest(SubmitPpdbTestRequest) returns (SubmitPpdbTestResponse);  // role 'ppdb'
  rpc GetMyPpdb(GetMyPpdbRequest) returns (PpdbRegistration);                  // role 'ppdb'

  // PPDB dokumen: pendaftar kirim link/upload (public); admin lihat
  rpc SubmitPpdbDocuments(SubmitPpdbDocumentsRequest) returns (SubmitPpdbDocumentsResponse); // public
  rpc ListPpdbDocuments(ListPpdbDocumentsRequest) returns (ListPpdbDocumentsResponse);       // kelola_sekolah
}
